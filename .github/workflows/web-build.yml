name: Web Build & Tests

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/web-build.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/web-build.yml']
  workflow_dispatch:

jobs:
  build-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: atelier-lp01-web-dist
          path: web/dist
          retention-days: 30
